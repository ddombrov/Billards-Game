<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="ball"><circle cx="128" cy="120" r="108"/></clipPath>
    <!-- main diffuse light from upper-left -->
    <radialGradient id="body" cx="86.96000000000001" cy="74.64" r="189.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#f2ebdd"/>
      <stop offset="0.78" stop-color="#bdb7ab"/>
      <stop offset="1" stop-color="#837d73"/>
    </radialGradient>
    <radialGradient id="bodyCream" cx="86.96000000000001" cy="74.64" r="189.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.28" stop-color="#f2ebdd"/>
      <stop offset="0.72" stop-color="#bdb7ab"/>
      <stop offset="1" stop-color="#837d73"/>
    </radialGradient>
    <!-- edge falloff -->
    <radialGradient id="rim" cx="128" cy="120" r="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.78" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.28"/>
    </radialGradient>
    <!-- table bounce light on the lower edge -->
    <radialGradient id="bounce" cx="138.8" cy="255.0" r="102.6" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18.4"/></filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5.4"/></filter>
    <filter id="ground" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="edgeBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <!-- number disc: faint dome so it follows the ball -->
    <radialGradient id="disc" cx="115.04" cy="103.8" r="64.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf7ee"/>
      <stop offset="0.7" stop-color="#f2ebdd"/>
      <stop offset="1" stop-color="#e2d8c4"/>
    </radialGradient>
    <!-- raised number: soft drop + top-left lit bevel -->
    <filter id="emboss" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="blur"/>
      <feOffset in="blur" dx="1.2" dy="2" result="drop"/>
      <feFlood flood-color="#3a2f1e" flood-opacity="0.3"/>
      <feComposite in2="drop" operator="in" result="shadow"/>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.6" specularExponent="12" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="225" elevation="48"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComponentTransfer in="specIn" result="specSoft"><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feOffset in="blur" dx="-1" dy="-1.4" result="up"/>
      <feComposite in="SourceAlpha" in2="up" operator="out" result="lowEdge"/>
      <feFlood flood-color="#000" flood-opacity="0.3"/>
      <feComposite in2="lowEdge" operator="in" result="lowShade"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/><feMergeNode in="lowShade"/><feMergeNode in="specSoft"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#ball)">
  <rect x="0" y="0" width="256" height="256" fill="url(#body)"/>
  <rect x="0" y="0" width="256" height="256" fill="url(#bounce)"/>
  </g>
  <g clip-path="url(#ball)">
  <circle cx="128" cy="120" r="108" fill="url(#rim)"/>
  <circle cx="128" cy="120" r="108" fill="#000" opacity="0.0"/>
  <ellipse cx="82.6" cy="68.2" rx="54.0" ry="38.9" fill="#fff" opacity="0.4" transform="rotate(-35 82.6 68.2)" filter="url(#soft)"/>
  <ellipse cx="79.4" cy="63.8" rx="14.0" ry="8.6" fill="#fff" opacity="0.0" transform="rotate(-35 79.4 63.8)" filter="url(#softer)"/>
  </g>
</svg>
