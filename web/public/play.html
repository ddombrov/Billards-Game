<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8-Ball</title>
<link rel="icon" href="/img/icons/eight.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  body { padding: 12px 16px; overflow: hidden; }
  /* The players, status and power sit in a column to the right of the table, below Settings, so the table
     gets the full height. */
  .wrap { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 18px; }
  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; padding-top: 40px; grid-column: 2; grid-row: 1; }

  /* Settings sits in the top-right corner, as in Splendor Duel; the table starts below it. */
  .settings-btn { position: fixed; top: 10px; right: 14px; z-index: 5; color: var(--muted-foreground); }
  .settings-btn img { width: 24px; height: 24px; }
  .menu { display: grid; gap: 8px; justify-items: center; }
  .menu .btn { min-width: 200px; }
  .code-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px;
              border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; }
  .code-row strong { letter-spacing: .2em; }

  /* Scoreboard */
  .scoreboard {
    display: grid;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 4px);
    overflow: hidden;
  }
  .player {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    transition: background .25s;
  }
  .player + .player { border-top: 1px solid var(--border); }
  .player.active { background: linear-gradient(270deg, rgba(217,177,90,.14), rgba(217,177,90,0)); }
  .player.active::after {
    content: "";
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--primary);
  }
  .player .top { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .player .name { font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    flex: none;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--primary-foreground);
    background: var(--primary);
    padding: 2px 8px;
    border-radius: 99px;
    visibility: hidden;
  }
  .player.active .badge { visibility: visible; }
  .player .group { color: var(--muted-foreground); font-size: 13px; }
  .tray { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; }

  #message {
    padding: 8px 14px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 14px;
    font-weight: 500;
    text-align: center;
  }
  #message:empty { display: none; }

  .stage { min-width: 0; min-height: 0; display: flex; grid-column: 1; grid-row: 1; }
  #board {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    user-select: none;
    cursor: crosshair;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,.55));
  }
  #board.busy { cursor: progress; }
  #board.waiting { cursor: default; }

  .controls { margin-top: auto; display: grid; gap: 8px; color: var(--muted-foreground); font-size: 13px; }
  .meter { display: flex; align-items: center; gap: 10px; min-height: 38px; }
  .power { flex: 1; height: 8px; background: var(--secondary); border-radius: 4px; overflow: hidden; }
  .power div {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #5fbf6b, var(--primary) 60%, #e5533d);
    background-size: 100% 100%;
  }
  .rules { margin: 0 0 16px; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; }
  .segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: var(--radius); background: var(--background); border: 1px solid var(--border); }
  .segmented button { border: 0; border-radius: calc(var(--radius) - 3px); padding: 8px 10px; background: transparent; color: var(--muted-foreground); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .segmented button.on { background: var(--accent); color: var(--foreground); }
  .winner-ball { display: flex; justify-content: center; margin-bottom: 12px; }
  .dialog.center { text-align: center; }
  .dialog.center .footer { justify-content: center; }
  .game-code { margin: 14px 0; font-size: 44px; font-weight: 800; letter-spacing: .3em; padding-left: .3em; color: var(--primary); }

  /* Narrow screens: the column goes above the table, with the two players side by side. */
  @media (max-width: 760px) {
    body { padding: 8px 10px; }
    .wrap { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 8px; padding-top: 40px; }
    .side { padding-top: 0; grid-column: 1; grid-row: 1; }
    .stage { grid-column: 1; grid-row: 2; }
    .side { gap: 8px; }
    .scoreboard { grid-template-columns: 1fr 1fr; }
    .player { padding: 8px 10px; }
    .player + .player { border-top: 0; border-left: 1px solid var(--border); }
    .player .name { font-size: 15px; }
    .controls { margin-top: 0; }
  }
</style>
</head>
<body>
<button type="button" class="btn btn-ghost settings-btn" id="openSettings"><img src="/img/icons/settings.png" alt="">Settings</button>
<div class="wrap">
  <div class="side">

    <div class="scoreboard">
      <div class="player" id="p0">
        <div class="top"><span class="name"></span><span class="badge">To shoot</span></div>
        <div class="group"></div>
        <div class="tray"></div>
      </div>
      <div class="player" id="p1">
        <div class="top"><span class="name"></span><span class="badge">To shoot</span></div>
        <div class="group"></div>
        <div class="tray"></div>
      </div>
    </div>

    <div id="message">Loading…</div>

    <div class="controls">
      <div class="meter">
        <span>Power</span>
        <div class="power"><div id="powerBar"></div></div>
        <button type="button" class="btn btn-outline" id="skip" hidden>Skip</button>
      </div>
    </div>
  </div>

  <div class="stage">
  <svg id="board" viewBox="-25 -25 2750 1400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="classicClip"><rect x="-25" y="-25" width="2750" height="1400"/></clipPath>
    </defs>
    <g id="world">
    <g id="modernTable"></g>
    <!-- The original Python version's table: a pale cloth, dark green cushions and black pockets. -->
    <g id="classicTable" clip-path="url(#classicClip)">
      <rect x="-25" y="-25" width="2750" height="1400" fill="darkgreen"/>
      <rect x="0" y="0" width="2700" height="1350" fill="#C0D0C0"/>
      <g id="pockets"></g>
    </g>
    <g id="guide"></g>
    <g id="balls"></g>
    <g id="cue"></g>
    </g>
  </svg>

  </div>
</div>

<div class="overlay" id="waitingDialog" hidden>
  <div class="dialog small center">
    <h2>Share this code</h2>
    <p class="game-code" id="waitingCode"></p>
    <p class="description">Send this code to your friend. They choose Play with friends, then Join with a code.</p>
    <p class="error" id="waitingError" hidden></p>
    <div class="footer">
      <button type="button" class="btn btn-outline" id="copyCode">Copy code</button>
      <button type="button" class="btn btn-primary" id="cancelRoom">Cancel game</button>
    </div>
  </div>
</div>

<div class="overlay" id="leaveDialog" hidden>
  <div class="dialog small">
    <h2>Leave this game?</h2>
    <p class="description" id="leaveText">The game is saved. You can resume it from the home page.</p>
    <div class="footer">
      <button type="button" class="btn btn-outline" data-close>Stay</button>
      <a class="btn btn-primary" href="/">Leave</a>
    </div>
  </div>
</div>

<div class="overlay" id="rulesDialog" hidden>
  <div class="dialog">
    <h2>Rules</h2>
    <div class="body" id="rulesBody"></div>
    <div class="footer"><button type="button" class="btn btn-primary" data-close>Got it</button></div>
  </div>
</div>

<div class="overlay" id="settingsDialog" hidden>
  <div class="dialog small">
    <h2>Settings</h2>
    <div class="body">
      <div class="code-row"><span>Rules</span><strong id="rulesetName"></strong></div>
      <div class="code-row" id="codeRow" hidden><span>Game code</span><strong id="codeText"></strong>
        <button type="button" class="btn btn-ghost" id="copyRoomCode">Copy</button></div>
      <div>
        <div class="field-label">Table</div>
        <div class="segmented" id="lookTabs">
          <button type="button" data-look="modern">Modern</button>
          <button type="button" data-look="classic">Classic</button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="btn btn-outline" id="openRules"><img src="/img/icons/rules.png" alt="">Rules</button>
        <button type="button" class="btn btn-outline" id="leave"><img src="/img/icons/leave-game.png" alt="">Leave game</button>
      </div>
    </div>
    <div class="footer"><button type="button" class="btn btn-primary" data-close>Done</button></div>
  </div>
</div>

<div class="overlay" id="winnerDialog" hidden>
  <div class="dialog small center">
    <div class="winner-ball" id="winnerBall"></div>
    <h2 id="winnerTitle"></h2>
    <p class="description" id="winnerText"></p>
    <p class="error" id="rematchError" hidden></p>
    <div class="footer">
      <a class="btn btn-outline" href="/">Back to home</a>
      <button type="button" class="btn btn-primary" id="rematch">Play again</button>
    </div>
  </div>
</div>

<script src="/confetti.js"></script>
<script src="/balls.js"></script>
<script type="module">
import { loadEngine, simulateShot, FRAME_RATE } from "/engine.js";
import { MAX_SPEED, TABLE_LENGTH, TABLE_WIDTH } from "/rules.js";

// Engine coordinates are portrait (x across 0-1350, y along 0-2700). The board is drawn
// landscape with the head of the table on the left.
const BALL_RADIUS = 28.5, HOLE_RADIUS = 85.5; // HOLE_RADIUS matches PHYLIB_HOLE_RADIUS in phylib.h
const POWER_PER_MM = 9, PLAYBACK = 2, POLL_MS = 1500;

const params = new URLSearchParams(location.search);
const gameKey = params.get("game");
const roomCode = params.get("room");
const online = !!roomCode;
const mine = online ? readSeat(roomCode) : null;
const look = getLook();

loadEngine();
const $ = (id) => document.getElementById(id);
const board = $("board");
const world = $("world");
const ballLayer = $("balls");
const guideLayer = $("guide");
const cueLayer = $("cue");
const powerBar = $("powerBar");
const skipButton = $("skip");
const messageEl = $("message");

let state = null;
let busy = false;
let dragging = false;
let skipRequested = false;
let celebrated = false;

const toScreen = (x, y) => [TABLE_LENGTH - y, x];

$("rulesBody").innerHTML = RULES_HTML;

document.querySelectorAll(".overlay").forEach((overlay) => {
  overlay.addEventListener("click", (e) => {
    if (["winnerDialog", "waitingDialog"].includes(overlay.id)) return;
    if (e.target === overlay || e.target.closest("[data-close]")) overlay.hidden = true;
  });
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") ["leaveDialog", "rulesDialog", "settingsDialog"].forEach((id) => ($(id).hidden = true));
});
$("leave").addEventListener("click", () => { $("settingsDialog").hidden = true; $("leaveDialog").hidden = false; });
$("openRules").addEventListener("click", () => { $("settingsDialog").hidden = true; $("rulesDialog").hidden = false; });
$("openSettings").addEventListener("click", () => ($("settingsDialog").hidden = false));
document.querySelectorAll("#lookTabs button").forEach((b) => {
  b.classList.toggle("on", b.dataset.look === look);
  // The table is drawn once, so a new look is applied by reloading; the game itself is saved.
  b.addEventListener("click", () => { if (b.dataset.look !== look) { setLook(b.dataset.look); location.reload(); } });
});
if (online) {
  $("leaveText").textContent = `To come back, choose Play with friends, then join with code ${roomCode}.`;
  $("codeRow").hidden = false;
  $("codeText").textContent = roomCode;
  $("copyRoomCode").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(roomCode); $("copyRoomCode").textContent = "Copied"; } catch { /* clipboard blocked */ }
  });
  $("rematch").hidden = true;
}

// The modern table is the table artwork, stretched so its playing area matches the engine's 2700 x 1350 mm.
const ART = { width: 1200, height: 680, field: { x: 88, y: 88, width: 1024, height: 504 } };
const ART_SX = TABLE_LENGTH / ART.field.width, ART_SY = TABLE_WIDTH / ART.field.height;
const POCKETS = [[80, 80, 30], [600, 70, 27], [1120, 80, 30], [80, 600, 30], [600, 610, 27], [1120, 600, 30]];

function drawModernTable() {
  const layer = $("modernTable");
  el("image", { href: "/img/table.svg", x: -ART.field.x * ART_SX, y: -ART.field.y * ART_SY,
                width: ART.width * ART_SX, height: ART.height * ART_SY, preserveAspectRatio: "none" }, layer);
  for (const [x, y, r] of POCKETS) {
    // hole.svg is 80 wide with a 30-unit opening; the opening is drawn close to the engine's capture radius.
    const size = 80 * (r / 30) * (HOLE_RADIUS * .85 / 30);
    const cx = (x - ART.field.x) * ART_SX, cy = (y - ART.field.y) * ART_SY;
    el("image", { href: "/img/hole.svg", x: cx - size / 2, y: cy - size / 2, width: size, height: size }, layer);
  }
}

function drawClassicTable() {
  for (const [x, y] of [[0, 0], [0, 1350], [0, 2700], [1350, 0], [1350, 1350], [1350, 2700]]) {
    const [sx, sy] = toScreen(x, y);
    el("circle", { cx: sx, cy: sy, r: HOLE_RADIUS, fill: "black" }, $("pockets"));
  }
}

function drawTable() {
  $("classicTable").style.display = look === "classic" ? "" : "none";
  if (look === "classic") return drawClassicTable();
  drawModernTable();
  // The artwork's rails are wider than the classic ones, so the view grows to show the whole table.
  view = [-ART.field.x * ART_SX, -ART.field.y * ART_SY, ART.width * ART_SX, ART.height * ART_SY];
}

// The table is drawn landscape, and stands upright on a tall screen (a phone held upright), like the original.
// Only the view turns: aiming works in the table's own coordinates through the world group.
let view = [-25, -25, 2750, 1400];
let upright = false;
function fitTable() {
  const stage = board.parentElement;
  upright = stage.clientHeight > stage.clientWidth;
  const [x, y, w, h] = view;
  board.setAttribute("viewBox", upright ? `${y} ${-(x + w)} ${h} ${w}` : view.join(" "));
  world.setAttribute("transform", upright ? "rotate(-90)" : "");
  for (const node of Object.values(ballNodes)) node.setAttribute("transform", ballTransform(node.dataset.at));
}
const ballTransform = (at) => `translate(${at})${upright ? " rotate(90)" : ""}`;

// The ball artwork is 256 units wide with the ball centred at (128, 120) and a 108-unit radius.
const russian = () => state?.ruleset === "russian";

function ballNode(n) {
  if (russian() && n > 0) return russianBallSVG(n, BALL_RADIUS * 2);
  if (look === "classic") return ballSVG(n, BALL_RADIUS * 2);
  const k = BALL_RADIUS / 108;
  const g = el("g", {});
  el("image", { href: ballArt(n, false), x: -128 * k, y: -120 * k, width: 256 * k, height: 256 * k }, g);
  return g;
}

const ballNodes = {};
function placeBalls(balls) {
  const present = new Set();
  for (const [n, x, y] of balls) {
    present.add(n);
    if (!ballNodes[n]) {
      ballNodes[n] = ballNode(n);
      ballLayer.appendChild(ballNodes[n]);
    }
    const [sx, sy] = toScreen(x, y);
    ballNodes[n].dataset.at = `${sx} ${sy}`;
    ballNodes[n].setAttribute("transform", ballTransform(ballNodes[n].dataset.at));
  }
  for (const n of Object.keys(ballNodes)) {
    if (!present.has(Number(n))) {
      ballNodes[n].remove();
      delete ballNodes[n];
    }
  }
}

function inGroup(n, group) {
  return group === "solids" ? n >= 1 && n <= 7 : group === "stripes" ? n >= 9 && n <= 15 : false;
}

const myTurn = () => !online || (state.seated && state.turn === mine.seat);

// The scoreboard already shows whose turn it is, so only the shot's events are written out.
function eventMessage() {
  const turnNote = `${state.players[state.turn]}'s turn.`;
  return state.message.endsWith(turnNote) ? state.message.slice(0, -turnNote.length).trim() : state.message;
}

function render() {
  $("rulesetName").textContent = RULESET_NAMES[state.ruleset] ?? RULESET_NAMES.eightball;
  document.title = `${state.players[0]} vs ${state.players[1] || "…"} · 8-Ball`;
  messageEl.textContent = busy ? "Rolling…" : online && !state.seated ? "Waiting for a second player…" : eventMessage();
  const onTable = new Set(state.balls.map(b => b[0]));
  state.players.forEach((name, i) => {
    const card = $("p" + i);
    card.classList.toggle("active", state.winner === null && state.turn === i);
    card.querySelector(".name").textContent = (name || "Waiting…") + (online && mine.seat === i ? " (you)" : "");
    const tray = card.querySelector(".tray");
    tray.innerHTML = "";
    if (russian()) {
      const potted = state.potted[i];
      card.querySelector(".group").textContent = `${potted.length} of 8 balls`;
      for (const n of potted) tray.appendChild(ballIcon(n, 22, undefined, true));
      return;
    }
    const group = state.groups[i];
    const left = group ? [...onTable].filter(n => inGroup(n, group)).sort((a, b) => a - b) : [];
    card.querySelector(".group").textContent = !group ? "Open table"
      : (group === "solids" ? "Solids" : "Stripes") + (left.length ? ` · ${left.length} left` : " · on the 8");
    if (group && left.length === 0 && onTable.has(8)) left.push(8);
    for (const n of left) tray.appendChild(ballIcon(n, 22));
  });
  board.classList.toggle("waiting", !myTurn());
  if (state.winner !== null && !celebrated) {
    celebrated = true;
    if (!online) forgetGame();
    const ball = $("winnerBall");
    ball.innerHTML = "";
    ball.appendChild(ballIcon(8, 56, undefined, russian()));
    $("winnerTitle").textContent = state.players[state.winner] + " wins!";
    $("winnerText").textContent = state.message;
    $("winnerDialog").hidden = false;
    celebrate();
  }
}

$("rematch").addEventListener("click", async () => {
  const button = $("rematch");
  button.disabled = true;
  try {
    await startGame(state.players[0], state.players[1], state.ruleset);
  } catch (error) {
    $("rematchError").textContent = error.message;
    $("rematchError").hidden = false;
    button.disabled = false;
  }
});

function cueBall() {
  const cue = state && state.balls.find(b => b[0] === 0);
  return cue ? toScreen(cue[1], cue[2]) : null;
}

function pointerToBoard(event) {
  const pt = board.createSVGPoint();
  pt.x = event.clientX;
  pt.y = event.clientY;
  const p = pt.matrixTransform(world.getScreenCTM().inverse());
  return [p.x, p.y];
}

// Shot in screen space: unit direction, pull distance and speed in mm/s.
function shotFromPointer(point) {
  const [cx, cy] = cueBall();
  const dx = cx - point[0], dy = cy - point[1];
  const pull = Math.hypot(dx, dy) || 1;
  return { ux: dx / pull, uy: dy / pull, pull, speed: Math.min(pull * POWER_PER_MM, MAX_SPEED) };
}

// Where the cue ball first touches a ball or cushion along the aim line.
function traceShot(cx, cy, ux, uy) {
  let best = { t: Infinity, ball: null };
  for (const [n, x, y] of state.balls) {
    if (n === 0) continue;
    const [bx, by] = toScreen(x, y);
    const ox = cx - bx, oy = cy - by;
    const b = ux * ox + uy * oy;
    const c = ox * ox + oy * oy - 4 * BALL_RADIUS * BALL_RADIUS;
    const disc = b * b - c;
    if (disc < 0) continue;
    const t = -b - Math.sqrt(disc);
    if (t > 0 && t < best.t) best = { t, ball: [bx, by] };
  }
  const walls = [
    ux < 0 ? (BALL_RADIUS - cx) / ux : ux > 0 ? (TABLE_LENGTH - BALL_RADIUS - cx) / ux : Infinity,
    uy < 0 ? (BALL_RADIUS - cy) / uy : uy > 0 ? (TABLE_WIDTH - BALL_RADIUS - cy) / uy : Infinity,
  ];
  for (const t of walls) if (t > 0 && t < best.t) best = { t, ball: null };
  return best;
}

function drawStick(stick, gap) {
  const length = 1300;
  if (look === "modern") {
    // cue-stick.svg is 1000 x 32 with the tip at its right end.
    const height = length * 32 / 1000;
    el("rect", { x: -gap - length + 10, y: -height / 2 + 14, width: length, height, rx: height / 2,
                 fill: "#000", "fill-opacity": .3 }, stick);
    el("image", { href: "/img/cue-stick.svg", x: -gap - length, y: -height / 2, width: length, height, preserveAspectRatio: "none" }, stick);
    return;
  }
  el("line", { x1: -gap - length, y1: 0, x2: -gap, y2: 0, stroke: "saddlebrown", "stroke-width": 14, "stroke-linecap": "round" }, stick);
}

function drawAim(shot) {
  guideLayer.innerHTML = "";
  cueLayer.innerHTML = "";
  const [cx, cy] = cueBall();
  const { ux, uy } = shot;

  const hit = traceShot(cx, cy, ux, uy);
  const gx = cx + ux * hit.t, gy = cy + uy * hit.t;
  el("line", { x1: cx, y1: cy, x2: gx, y2: gy, stroke: "#fff", "stroke-opacity": .55,
               "stroke-width": 4, "stroke-dasharray": "16 14" }, guideLayer);
  el("circle", { cx: gx, cy: gy, r: BALL_RADIUS, fill: "#fff", "fill-opacity": .08,
                 stroke: "#fff", "stroke-opacity": .7, "stroke-width": 4 }, guideLayer);
  if (hit.ball) {
    const [bx, by] = hit.ball;
    const nx = bx - gx, ny = by - gy, len = Math.hypot(nx, ny);
    el("line", { x1: bx, y1: by, x2: bx + nx / len * 260, y2: by + ny / len * 260,
                 stroke: "#d9b15a", "stroke-opacity": .85, "stroke-width": 5,
                 "stroke-linecap": "round" }, guideLayer);
  }

  const gap = BALL_RADIUS + 10 + Math.min(shot.pull, MAX_SPEED / POWER_PER_MM) * .35;
  const angle = Math.atan2(uy, ux) * 180 / Math.PI;
  drawStick(el("g", { transform: `translate(${cx} ${cy}) rotate(${angle})` }, cueLayer), gap);
  powerBar.style.width = (100 * shot.speed / MAX_SPEED) + "%";
}

function clearAim() {
  guideLayer.innerHTML = "";
  cueLayer.innerHTML = "";
  powerBar.style.width = "0";
}

board.addEventListener("pointerdown", event => {
  if (busy || !state || state.winner !== null || !cueBall() || !myTurn()) return;
  board.setPointerCapture(event.pointerId);
  dragging = true;
  drawAim(shotFromPointer(pointerToBoard(event)));
});

board.addEventListener("pointermove", event => {
  if (dragging) drawAim(shotFromPointer(pointerToBoard(event)));
});

board.addEventListener("pointerup", event => {
  if (!dragging) return;
  dragging = false;
  const shot = shotFromPointer(pointerToBoard(event));
  clearAim();
  if (shot.speed < 60) return;
  // Screen direction (ux, uy) maps back to table velocity (vx = uy, vy = -ux).
  shoot(shot.uy * shot.speed, -shot.ux * shot.speed);
});

board.addEventListener("pointercancel", () => { dragging = false; clearAim(); });

const shotPath = () => online ? `/rooms/${roomCode}/shots` : `/games/${encodeURIComponent(gameKey)}/shots`;

async function shoot(vx, vy) {
  busy = true;
  board.classList.add("busy");
  render();
  let failure = null;
  try {
    const result = await simulateShot(state.balls, vx, vy);
    // Save while the shot plays; the Worker applies the rules and returns the next turn.
    const saved = api("POST", shotPath(), { token: mine?.token, shot: state.shots, vx, vy,
                                            time: (result.frames.length - 1) * FRAME_RATE,
                                            pocketed: result.pocketed, balls: result.balls });
    saved.catch(() => {}); // reported after the animation below
    await animate(result.frames);
    state = await saved;
  } catch (error) {
    console.error(error);
    failure = error;
    await load();
  } finally {
    busy = false;
    board.classList.remove("busy");
    if (state) {
      placeBalls(state.balls);
      render();
    }
    if (failure) messageEl.textContent = "Shot failed: " + failure.message;
  }
}

function animate(frames) {
  skipRequested = false;
  skipButton.hidden = false;
  return new Promise(resolve => {
    let start = null;
    function step(now) {
      if (start === null) start = now;
      const index = Math.min(Math.floor((now - start) / 1000 * PLAYBACK / FRAME_RATE), frames.length - 1);
      placeBalls(frames[index]);
      if (skipRequested || index === frames.length - 1) {
        placeBalls(frames[frames.length - 1]);
        skipButton.hidden = true;
        resolve();
      } else {
        requestAnimationFrame(step);
      }
    }
    requestAnimationFrame(step);
  });
}

skipButton.addEventListener("click", () => { skipRequested = true; });

function showMissing(text) {
  if (!online) forgetGame();
  messageEl.innerHTML = `${text} <a href="/" style="color: var(--primary)">Back to home</a>`;
}

function fetchState() {
  if (!online) return api("GET", "/games/" + encodeURIComponent(gameKey));
  return api("GET", `/rooms/${roomCode}?token=${encodeURIComponent(mine.token)}`);
}

async function load() {
  if (online && !mine) return showMissing("You are not in this game. Join it with its code from the home page.");
  try {
    state = await fetchState();
  } catch (error) {
    return showMissing(error.reason === "forbidden" ? "Someone else took your seat in this game." : "This game could not be found.");
  }
  if (!online && state.winner === null) rememberGame(state.key);
  placeBalls(state.balls);
  render();
  showWaiting();
}

function showWaiting() {
  $("waitingDialog").hidden = !(online && !state.seated && mine.seat === 0);
  $("waitingCode").textContent = roomCode;
}

// The other player's shot: replay it with the same engine from the same table, then take the saved result.
async function replay(next) {
  busy = true;
  render();
  try {
    const result = await simulateShot(next.last.from, next.last.vx, next.last.vy);
    await animate(result.frames);
  } finally {
    busy = false;
  }
}

async function poll() {
  if (!busy && state && state.winner === null) {
    try {
      const next = await fetchState();
      if (!busy) {
        if (next.shots === state.shots + 1 && next.last?.shot === state.shots) await replay(next);
        state = next;
        placeBalls(state.balls);
        render();
        showWaiting();
      }
    } catch (error) {
      if (error.reason === "forbidden" || error.reason === "notfound") {
        state = null;
        return showMissing(error.reason === "forbidden" ? "Someone else took your seat in this game." : "This game no longer exists.");
      }
    }
  }
  setTimeout(poll, POLL_MS);
}

$("copyCode").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(roomCode); $("copyCode").textContent = "Copied"; } catch { /* clipboard blocked */ }
});
$("cancelRoom").addEventListener("click", async () => {
  try {
    await api("DELETE", `/rooms/${roomCode}`, { token: mine.token });
    location.href = "/";
  } catch (error) {
    $("waitingError").textContent = error.message;
    $("waitingError").hidden = false;
  }
});

drawTable();
fitTable();
new ResizeObserver(fitTable).observe(board.parentElement);
await load();
if (online && state) setTimeout(poll, POLL_MS);
</script>
</body>
</html>
